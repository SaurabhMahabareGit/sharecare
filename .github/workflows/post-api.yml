name: post-api-ci

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm test --if-present

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: sharecareacr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Image
        run: |
          docker build -t sharecareacr.azurecr.io/post-api:${{ github.sha }} .

      - name: Push Image
        run: |
          docker push sharecareacr.azurecr.io/post-api:${{ github.sha }}
``
