name: user-api-ci

on:
  push:
    branches:
      - main
    paths:
      - 'user-api/**'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: user-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test --if-present

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Image
        run: |
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/user-api:${{ github.sha }} .

      - name: Push Image
        run: |
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/user-api:${{ github.sha }}
